name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump to release
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish release
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve version
        id: version
        shell: pwsh
        env:
          VERSION_BUMP: ${{ inputs.bump }}
        run: .\scripts\prepare-release.ps1 -Bump "$env:VERSION_BUMP"

      - name: Build and check
        shell: pwsh
        run: .\scripts\build.ps1 -Test -Package

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: .\scripts\publish-release.ps1 -Tag "$env:RELEASE_TAG" -Branch "$env:GITHUB_REF_NAME"
