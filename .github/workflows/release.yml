name: Release

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  draft:
    name: Check and prepare draft release
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve release tag
        id: version
        shell: pwsh
        run: |
          $version = (Get-Content -LiteralPath VERSION -Raw).Trim()
          if ($version -notmatch '^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$') {
            throw 'VERSION must be a three-part numeric version.'
          }
          $tag = "v$version"
          if ($env:GITHUB_EVENT_NAME -eq 'push' -and $env:GITHUB_REF_NAME -ne $tag) {
            throw 'Release tag must match VERSION.'
          }
          $existing = git tag --list $tag
          if ($LASTEXITCODE -ne 0) { throw 'Could not check existing tags.' }
          if ($existing) {
            $commit = git rev-parse "$tag^{commit}"
            if ($LASTEXITCODE -ne 0 -or $commit -ne $env:GITHUB_SHA) {
              throw "Tag $tag already points to another commit. Update VERSION before releasing."
            }
          }
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
      - name: Build and check
        shell: pwsh
        run: .\scripts\build.ps1 -Test -Package
      - name: Create draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          $assets = @(Get-ChildItem -LiteralPath artifacts -File | ForEach-Object { $_.FullName })
          gh release create $env:RELEASE_TAG @assets --target $env:GITHUB_SHA --draft --generate-notes --title "XSanity PIU Scores Hook $env:RELEASE_TAG"
          if ($LASTEXITCODE -ne 0) { throw 'Draft release creation failed.' }
